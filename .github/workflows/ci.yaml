name: ci

on:
  push:
    branches:
    - master
    - main
    tags:
      - '*'
  pull_request:
    branches:
    - '*'
  schedule:
    - cron: '0 0 * * 1'  # weekly
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: python3 -m pip install ".[testing]"
    - name: Test
      run: python3 -m pytest -n auto tests

  # compare against genuine R and castor, run on the fly
  test-against-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # conda-forge has no r-castor builds for ARM
        os: [ubuntu-24.04]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install
      run: python3 -m pip install ".[testing]" "py-rattler==0.28.0"
    - name: Install R and castor
      run: python3 tests/install_r_env.py "${RUNNER_TEMP}/r-env"
    - name: Test
      env:
        CASTORBIND_REQUIRE_R: "1"
      run: |
        export CASTORBIND_RSCRIPT="${RUNNER_TEMP}/r-env/bin/Rscript"
        python3 -m pytest -n auto tests

  tidy:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Check generated stubs are up to date
      run: python3 src/gen_bindings.py --check
    - name: Check vendored sources are unmodified
      run: git submodule foreach git diff --exit-code
    - name: Check formatting
      run: |
        python3 -m pip install "black==22.10.0" "isort>=5.12.0" "ruff>=0.1.11"
        python3 -m black --check python src tests
        python3 -m isort --check python src tests
        python3 -m ruff check python src tests

  packaging-sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Build sdist
        run: pipx run build --sdist
      - name: Install from sdist
        run: python3 -m pip install dist/*.tar.gz
      - name: Test install
        run: |
          cd
          python3 -c "import castorbind; print(castorbind.__version__, castorbind.castor_version)"

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          # castor's single 33k-line source file needs ~2 GB RAM to compile
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          CIBW_ARCHS_MACOS: ${{ matrix.os == 'macos-13' && 'x86_64' || 'arm64' }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build_sdist
      - build_wheels
      - packaging-sdist
      - test
      - test-against-r
      - tidy
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        # unpacks default artifact into dist/
        # if `name: artifact` is omitted, the action will create extra parent dir
        pattern: cibw-*
        path: dist
        merge-multiple: true
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true
